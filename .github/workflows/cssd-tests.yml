name: CSSD forecast regression tests

on:
  push:
    branches: [main]
    paths: ['cssd-by-xgboost/**', '.github/workflows/cssd-tests.yml']
  pull_request:
    paths: ['cssd-by-xgboost/**', '.github/workflows/cssd-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas xgboost scikit-learn
      - name: Run regression and real-estimator tests
        run: python -m unittest discover -s cssd-by-xgboost/tests -v
